<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RPG LLM</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<style>
:root {
  --bg: #f6f4ef; --panel: #ffffff; --ink: #1d1b18; --muted: #6d675e; --line: #e2ddd3;
  --accent: #9a4a12; --accent-ink: #fff; --player: #eef3f8; --gm: #ffffff; --warn: #a33;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --panel: #1d2024; --ink: #e8e4dc; --muted: #9a958c; --line: #2d3136;
    --accent: #e0914d; --accent-ink: #1a1208; --player: #1f2a36; --gm: #1d2024; --warn: #f07a7a;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --panel: #1d2024; --ink: #e8e4dc; --muted: #9a958c; --line: #2d3136;
  --accent: #e0914d; --accent-ink: #1a1208; --player: #1f2a36; --gm: #1d2024; --warn: #f07a7a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 16px/1.55 Georgia, "Iowan Old Style", "Palatino Linotype", serif; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel);
  border-radius: 8px; padding: 6px 12px; font-family: system-ui, sans-serif; font-size: 14px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
.ui { font-family: system-ui, sans-serif; font-size: 14px; }
.muted { color: var(--muted); }
header { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; align-items: center;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header a { color: inherit; text-decoration: none; }
header h1 { font-size: 17px; margin: 0; flex: 1; min-width: 0; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
#app { display: flex; flex-direction: column; height: 100%; }
main { flex: 1; overflow-y: auto; }
.wrap, .footwrap { width: 80%; margin: 0 auto; padding: 16px; }
@media (max-width: 900px) { .wrap, .footwrap { width: 100%; } }
.footwrap { padding: 0; }

/* campaign list */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 10px; }
.card.link { cursor: pointer; }
.card.link:hover { border-color: var(--accent); }
label { display: block; margin: 10px 0 4px; }
input, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--bg); }

/* chat */
.msg { margin: 14px 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
  overflow-wrap: anywhere; }
.msg.user { background: var(--player); margin-left: 12%; }
.msg.assistant { background: var(--gm); }
.msg p { margin: 0 0 .7em; } .msg p:last-child { margin-bottom: 0; }
.msg h1, .msg h2, .msg h3 { font-size: 1.05em; margin: .8em 0 .4em; }
.msg ul, .msg ol { margin: 0 0 .7em; padding-left: 1.3em; }
.msg code { font-family: var(--mono); font-size: .9em; }
.msg hr { border: 0; border-top: 1px solid var(--line); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.chip { font: 12px system-ui, sans-serif; color: var(--muted); border: 1px solid var(--line);
  border-radius: 999px; padding: 1px 8px; }
.actions button { padding: 2px 8px; font-size: 12px; }
details.think { margin-bottom: 8px; font: 13px/1.45 system-ui, sans-serif; color: var(--muted); }
details.think summary { cursor: pointer; }
details.think div { white-space: pre-wrap; max-height: 260px; overflow-y: auto; padding: 6px 0; }
.divider { display: flex; align-items: center; gap: 10px; margin: 22px 0 8px;
  font: 12px system-ui, sans-serif; color: var(--muted); text-transform: uppercase;
  letter-spacing: .06em; }
.divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.filed .msg { opacity: .72; }
.msg.user.editing { outline: 2px dashed var(--accent); }
#more { display: block; margin: 8px auto; }

footer { border-top: 1px solid var(--line); background: var(--panel);
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); }
#statusline { min-height: 18px; margin-bottom: 6px; }
.composer { display: flex; gap: 8px; align-items: flex-end; }
#input { resize: none; max-height: 40vh; min-height: 44px; }
.error { color: var(--warn); }

/* drawer */
#drawer { position: fixed; inset: 0 0 0 auto; width: min(460px, 100%); background: var(--panel);
  border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .2s;
  z-index: 10; display: flex; flex-direction: column; }
#drawer.open { transform: none; }
#drawer .body { overflow-y: auto; padding: 12px 16px 40px; flex: 1; }
#drawer h3 { font: 600 13px system-ui, sans-serif; text-transform: uppercase;
  letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
#drawer li { margin: 3px 0; }
#drawer a { color: var(--accent); cursor: pointer; }
pre.file { white-space: pre-wrap; font: 13px/1.5 var(--mono); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.hidden { display: none !important; }
/* the campaign list sits on a faint all-genres wallpaper; cards stay solid on top */
body[data-page="list"] { background: linear-gradient(var(--wash), var(--wash)),
  url("/static/backdrops/home.webp") center / cover fixed; }
body[data-page="list"] header { background: var(--chrome-home); backdrop-filter: blur(10px) saturate(1.1);
  border-bottom-color: var(--chrome-line); }
body { --wash: rgba(246,244,239,.28); --chrome-home: rgba(248,244,236,.42); --chrome-line: rgba(120,100,70,.12); }
body[data-mode="dark"] { --wash: rgba(21,23,26,.86); --chrome-home: rgba(24,26,30,.5); --chrome-line: rgba(255,255,255,.06); }

/* ---- themed play page: painted backdrop per genre and setting ---------------------------- */
.backdrop, .backdrop-shade { position: fixed; inset: 0; z-index: 0; pointer-events: none; display: none; }
.backdrop { background: center / cover no-repeat; opacity: 0; transition: opacity 1.6s ease;
  filter: brightness(1.05); }
.backdrop.on { opacity: 1; }
.backdrop-shade { background: linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,.3) 14%,
  rgba(0,0,0,.42) 50%, rgba(0,0,0,.3) 86%, rgba(0,0,0,0)); }
@media (max-width: 900px) { .backdrop-shade { background: rgba(0,0,0,.42); } }
@media (prefers-reduced-motion: reduce) { .backdrop { transition: none; } }
/* art view: the painting on its own, messages faded away */
main, #input, #send, #statusline, header > *:not(#title), .backdrop-shade { transition: opacity .45s ease; }
body[data-viewart] main, body[data-viewart] #input, body[data-viewart] #send,
body[data-viewart] header > *:not(#title), body[data-viewart] .backdrop-shade { opacity: 0; pointer-events: none; }
body[data-look][data-viewart] header, body[data-look][data-viewart] footer {
  background: transparent; backdrop-filter: none; border-color: transparent; }
body[data-viewart] #title, body[data-viewart] #statusline { text-shadow: 0 1px 4px rgba(0,0,0,.8); color: #f2efe8; }
body[data-viewart] .backdrop { filter: none; }
#artBtn { font-size: 16px; padding: 6px 10px; }
body[data-viewart] #artBtn { background: rgba(0,0,0,.45); color: #fff; border-color: rgba(255,255,255,.35); }
body[data-look] .backdrop, body[data-look] .backdrop-shade { display: block; }
body[data-look] { background: #000; }
body[data-look] #app { position: relative; z-index: 1; }
body[data-look] header, body[data-look] footer { background: var(--chrome); backdrop-filter: blur(6px); }
body[data-look] .msg { box-shadow: 0 2px 18px rgba(0,0,0,.35); }
body[data-look] h1, body[data-look] .divider { font-family: var(--display); }
body[data-look="scifi"] {
  --bg: #070b14; --panel: rgba(12,18,32,.9); --chrome: rgba(8,12,22,.82); --ink: #dfe6f0;
  --muted: #8d9ab0; --line: rgba(130,160,210,.2); --accent: #6fb7e8; --accent-ink: #04121c;
  --player: rgba(24,40,66,.9); --gm: rgba(10,16,28,.88); --warn: #f28b82;
  --display: "Exo 2", system-ui, sans-serif; }
body[data-look="fantasy"] {
  --bg: #0e0c08; --panel: rgba(28,24,16,.9); --chrome: rgba(20,17,11,.84); --ink: #ece3cf;
  --muted: #a89a7c; --line: rgba(200,170,110,.22); --accent: #d4a24c; --accent-ink: #1b1408;
  --player: rgba(46,40,26,.9); --gm: rgba(22,19,12,.88); --warn: #f08a6a;
  --display: "Cinzel", Georgia, serif; }
body[data-look="horror"] {
  --bg: #070707; --panel: rgba(16,15,14,.9); --chrome: rgba(10,10,10,.85); --ink: #e6e0d4;
  --muted: #9a9387; --line: rgba(220,210,190,.15); --accent: #c0544a; --accent-ink: #fff;
  --player: rgba(36,32,30,.9); --gm: rgba(12,11,10,.89); --warn: #f07a7a;
  --display: "IM Fell English", Georgia, serif; }
body[data-look][data-mode="light"] {
  --bg: #f3f0ea; --panel: rgba(250,248,244,.94); --chrome: rgba(250,248,244,.9); --ink: #1d1b18;
  --muted: #5d584f; --line: rgba(0,0,0,.13); --gm: rgba(252,251,248,.95);
  --player: rgba(233,239,246,.96); --accent-ink: #fff; --warn: #a33; }
body[data-look][data-mode="light"] .backdrop-shade { opacity: .6; }
body[data-look] .divider { color: rgba(240,236,228,.72); text-shadow: 0 1px 3px rgba(0,0,0,.6); }
body[data-look] .divider::before, body[data-look] .divider::after { border-color: rgba(240,236,228,.22); }
body[data-look] #more { background: var(--panel); }
body[data-look="scifi"][data-mode="light"] { --accent: #1f6fa8; --player: rgba(228,238,250,.96); }
body[data-look="fantasy"][data-mode="light"] { --accent: #8a5a12; --player: rgba(245,238,222,.96); }
body[data-look="horror"][data-mode="light"] { --accent: #8e2a22; --player: rgba(240,234,228,.96); }
body[data-look="cyberpunk"][data-mode="light"] { --accent: #b0127a; --player: rgba(244,232,246,.96); }
body[data-look="cyberpunk"] {
  --bg: #05030a; --panel: rgba(14,8,24,.88); --chrome: rgba(8,4,16,.82); --ink: #e8e6f5;
  --muted: #a39ac0; --line: rgba(255,60,200,.22); --accent: #ff3cb4; --accent-ink: #12030c;
  --player: rgba(30,14,48,.9); --gm: rgba(10,6,18,.87); --warn: #ff8a8a;
  --display: "Share Tech Mono", ui-monospace, monospace; }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.gcard { position: relative; min-height: 170px; border-radius: 14px; overflow: hidden; cursor: pointer;
  display: flex; align-items: flex-end; border: 1px solid var(--line); transition: transform .15s, box-shadow .15s; }
.gcard:hover { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(0,0,0,.25); }
.gcard.art { color: #f2efe8; background: #000; }
.gcard.art::before, .gcard.art::after { content: ""; position: absolute; inset: 0; }
.gcard.art::before { background: var(--art) center / cover; filter: brightness(1.1); }
.gcard.art::after { background: linear-gradient(to top, rgba(0,0,0,.8) 8%, rgba(0,0,0,.15) 55%, rgba(0,0,0,0)); }
.gcard .gbody, .gcard .del { position: relative; z-index: 1; }
.gcard .del { position: absolute; }
.gcard.plainlook { background: var(--panel); }
.gbody { display: flex; gap: 12px; align-items: flex-end; padding: 14px 16px; width: 100%; }
.gport { width: 58px; height: 58px; border-radius: 50%; object-fit: cover; flex: none;
  border: 2px solid rgba(255,255,255,.6); }
.gtext { min-width: 0; }
.gname { font-size: 19px; font-weight: 600; line-height: 1.25; }
.gmeta { font: 13px/1.4 system-ui, sans-serif; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gcard .del { position: absolute; top: 8px; right: 8px; border: 0; background: rgba(0,0,0,.35);
  color: #fff; opacity: 0; font-size: 14px; border-radius: 8px; transition: opacity .15s; }
.gcard:hover .del, .gcard:focus-within .del { opacity: .85; }
@media (pointer: coarse) { .gcard .del { opacity: .7; } }
.welcome { text-align: center; max-width: 640px; margin: 5vh auto 0; }
.welcome .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; border-radius: 14px; overflow: hidden; }
.welcome .strip div { height: 110px; background: center / cover; }
.welcome h2 { font-size: 22px; margin: 22px 0 6px; }
#modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45);
  display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 5vh 16px; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px 18px 18px; width: min(720px, 100%); }
.sheethead { display: flex; justify-content: space-between; align-items: center; }
.sheet select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.small { font-size: 12px; margin-top: 4px; }
.sheet a { color: var(--accent); cursor: pointer; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
label.check { display: flex; gap: 8px; align-items: center; margin-top: 16px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
@media (max-width: 620px) { .two { grid-template-columns: 1fr; } }
.rolls { margin: 0 0 10px; display: flex; flex-direction: column; gap: 4px; }
.roll { font: 13px/1.4 system-ui, sans-serif; padding: 5px 10px; border-radius: 8px;
  background: var(--bg); border: 1px solid var(--line); }
.roll.ok { border-left: 3px solid #3c8d4a; } .roll.fail { border-left: 3px solid var(--warn); }
/* on-screen dice */
.rollreq { margin-top: 12px; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, transparent); font: 14px/1.4 system-ui, sans-serif; }
.rollreq .rq-title { font-weight: 600; }
.rollreq .rq-dice { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 4px; }
.rollreq.live .die { cursor: pointer; transition: transform .15s; }
.rollreq.live .die:hover { transform: rotate(-8deg) scale(1.08); }
.die { width: 46px; height: 46px; flex: none; }
.die polygon, .die circle, .die rect { fill: color-mix(in srgb, var(--accent) 14%, var(--panel)); stroke: var(--accent); stroke-width: 4; }
.die line { stroke: var(--accent); stroke-width: 2; opacity: .45; }
.die text { fill: var(--ink); font: 700 34px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
.dicefly { position: fixed; inset: 0; z-index: 30; pointer-events: none; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px; }
.dicefly .row { display: flex; gap: 16px; }
.dicefly .die { width: 92px; height: 92px; filter: drop-shadow(0 8px 16px rgba(0,0,0,.45));
  animation: tumble 1.15s cubic-bezier(.2,.75,.3,1) both; }
@keyframes tumble { 0% { transform: translate(-55vw, 32vh) rotate(-900deg) scale(.45); }
  72% { transform: translate(10px, -8px) rotate(24deg) scale(1.08); } 100% { transform: none; } }
.dicefly .banner { font: 700 26px system-ui, sans-serif; padding: 8px 18px; border-radius: 12px;
  background: var(--panel); color: var(--ink); box-shadow: 0 6px 24px rgba(0,0,0,.35); opacity: 0;
  transition: opacity .25s; }
.dicefly .banner.show { opacity: 1; }
.dicefly .banner.ok { color: #2f8a45; } .dicefly .banner.fail { color: var(--warn); }
.dicefly.fade { transition: opacity .5s; opacity: 0; }
@media (prefers-reduced-motion: reduce) { .dicefly .die { animation: none; } }
.rolled { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font: 14px/1.4 system-ui, sans-serif; }
.rolled .die { width: 32px; height: 32px; }
.rolled .die text { font-size: 38px; }
.rolled .res.ok { color: #2f8a45; font-weight: 600; } .rolled .res.fail { color: var(--warn); font-weight: 600; }
.histnav { display: inline-flex; gap: 6px; align-items: center; }
.portraitbox { display: flex; gap: 14px; align-items: flex-start; }
.portraitbox > div:last-child { flex: 1; min-width: 0; }
.pimg { width: 144px; height: 144px; border-radius: 12px; flex: none; background: var(--bg) center / cover;
  border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
  color: var(--muted); font: 12px system-ui, sans-serif; text-align: center; }
@media (max-width: 620px) { .portraitbox { flex-direction: column; } }
.urow { display: flex; gap: 10px; align-items: flex-start; margin-left: 12%; }
.urow .msg.user { margin-left: 0; flex: 1; min-width: 0; }
/* avatars: yours beside your messages, the people in a GM message beside it; a light ring
   makes them stand out against the backdrop */
.avatar, .npcs img { border-radius: 50%; object-fit: cover; cursor: pointer; flex: none;
  padding: 3px; background: #f7f4ee; border: 1px solid rgba(0,0,0,.12);
  box-shadow: 0 2px 10px rgba(0,0,0,.35); }
.avatar { width: 51px; height: 51px; margin-top: 14px; }  /* a one-line message's height */
.msg.assistant { position: relative; }
.npcs { position: absolute; left: -60px; top: 0; display: flex; flex-direction: column; gap: 8px; }
.npcs img { width: 46px; height: 46px; }
@media (max-width: 900px) {
  .npcs { position: static; float: right; flex-direction: row; gap: 6px; margin: 0 0 6px 10px; }
  .npcs img { width: 38px; height: 38px; }
}
@media (max-width: 620px) { .urow { margin-left: 4%; } .avatar { width: 40px; height: 40px; } }
.thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.thumbs img { width: 52px; height: 52px; border-radius: 8px; cursor: pointer; opacity: .7; border: 2px solid transparent; }
.thumbs img.cur { opacity: 1; border-color: var(--accent); }
.histnav button { padding: 4px 9px; }
label.check input { width: auto; }

/* ---- reminder rail: icons that open the side panels ------------------------------------ */
#rail { display: flex; gap: 6px; z-index: 11; transition: opacity .45s ease, right .2s; }
#rail button { position: relative; width: 42px; height: 42px; padding: 0; display: flex;
  align-items: center; justify-content: center; border-radius: 12px; color: var(--muted);
  background: var(--panel); }
#rail button:hover { color: var(--ink); border-color: var(--accent); }
#rail button.on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
#rail svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round; }
#rail .dot { position: absolute; top: 5px; right: 5px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--panel); display: none; }
#rail button.changed .dot { display: block; }
#rail button.on .dot { display: none; }
#rail .sep { flex: none; width: 1px; height: 1px; margin: 2px; }
@media (min-width: 901px) {
  #rail { position: fixed; right: 12px; top: 50%; transform: translateY(-50%); flex-direction: column; }
  body[data-drawer] #rail { right: calc(min(460px, 100%) + 10px); }
  #rail .sep { height: 8px; }
}
@media (max-width: 900px) {
  .footrow #statusline { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #rail { gap: 4px; }
  #rail button { width: 36px; height: 36px; border-radius: 10px; }
  #rail svg { width: 19px; height: 19px; }
  #rail .sep { display: none; }
}
.footrow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.footrow #statusline { flex: 1; min-width: 0; margin-bottom: 0; }
body[data-viewart] #rail { opacity: 0; pointer-events: none; }
body[data-look] #rail button { box-shadow: 0 2px 10px rgba(0,0,0,.3); }
body[data-look] #drawer { backdrop-filter: blur(10px); }
/* a pinned panel sits beside the chat on wide screens */
@media (min-width: 1200px) {
  body[data-pinned][data-drawer] #app { margin-right: min(460px, 100%); }
  body[data-pinned][data-drawer] .wrap, body[data-pinned][data-drawer] .footwrap { width: 88%; }
  body[data-pinned][data-drawer] #rail { right: calc(min(460px, 100%) + 10px); }
}
@media (max-width: 1199px) { #pinBtn { display: none; } }
#drawer header { gap: 6px; }
#pinBtn.on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.pcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 0;
  background: color-mix(in srgb, var(--bg) 60%, transparent); }
.pcard .ptop { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.pcard .pname { font-weight: 600; font-size: 15px; }
.pcard .pwho { display: flex; gap: 10px; align-items: center; min-width: 0; flex: 1; }
.pcard .ptop > span { flex: none; white-space: nowrap; }
.pcard .ptop:has(.pwho) { align-items: center; }
.pcard .pport { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex: none; padding: 2px;
  background: #f7f4ee; border: 1px solid rgba(0,0,0,.12); }
.pcard.focus { outline: 2px solid var(--accent); }
.pcard .pport { cursor: zoom-in; }

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S = { slug: null, data: null, busy: false, shown: 150, poll: null };

// ---- theme ---------------------------------------------------------------
(function () {
  let t = null; try { t = localStorage.getItem("theme"); } catch {}
  if (t) document.documentElement.dataset.theme = t;
})();
// Light/dark: the page tokens follow the choice (or the OS). Themed play pages keep their
// painted backdrop either way; body[data-mode] switches their bubbles and bars.
function applyMode() {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  document.body.dataset.mode = document.documentElement.dataset.theme || (dark ? "dark" : "light");
}
$("themeBtn").onclick = () => {
  const next = document.body.dataset.mode === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch {}
  applyMode();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyMode);
applyMode();

// ---- tiny markdown -------------------------------------------------------
function md(src) {
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/(^|\W)_([^_\n]+)_(?=\W|$)/g, "$1<em>$2</em>");
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const block of String(src || "").split(/\n{2,}/)) {
    const lines = block.split("\n");
    if (lines.every(l => /^\s*([-*]|\d+\.)\s+/.test(l))) {
      const type = /^\s*\d+\./.test(lines[0]) ? "ol" : "ul";
      if (list !== type) { close(); out.push(`<${type}>`); list = type; }
      for (const l of lines) out.push(`<li>${inline(l.replace(/^\s*([-*]|\d+\.)\s+/, ""))}</li>`);
      continue;
    }
    close();
    const h = block.match(/^(#{1,3})\s+(.*)$/);
    if (h && lines.length === 1) out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);
    else if (/^(-{3,}|\*{3,})$/.test(block.trim())) out.push("<hr>");
    else out.push(`<p>${lines.map(inline).join("<br>")}</p>`);
  }
  close();
  return out.join("");
}

// ---- api -----------------------------------------------------------------
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!r.ok) {
    const text = await r.text();
    let msg = text; try { msg = JSON.parse(text).detail || text; } catch {}
    throw new Error(msg || r.statusText);
  }
  return r.json();
}

async function streamPost(path, body, handlers, signal) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
                                body: body ? JSON.stringify(body) : undefined, signal });
  if (!r.ok) throw new Error((await r.text()) || r.statusText);
  const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const line = buf.slice(0, i); buf = buf.slice(i + 2);
      if (line.startsWith("data: ")) { const ev = JSON.parse(line.slice(6)); handlers[ev.type]?.(ev); }
    }
  }
}

// ---- campaign list -------------------------------------------------------
async function showList() {
  S.slug = null; clearInterval(S.poll);
  history.replaceState(null, "", "/");
  $("title").textContent = "Campaigns";
  ["back", "rail", "footer", "diceBtn"].forEach(id => $(id).classList.add("hidden"));
  closePanel(); closeTray();
  toggleArt(false);
  setLook(null);
  document.body.dataset.page = "list";
  $("newBtn").classList.remove("hidden");
  const list = await api("/api/campaigns");
  const when = (t) => {
    if (!t) return "not started";
    const d = (Date.now() / 1000 - t) / 86400;
    return d < 1 ? "played today" : d < 2 ? "played yesterday" : d < 14 ? `played ${Math.floor(d)} days ago` : "last played " + new Date(t * 1000).toLocaleDateString();
  };
  $("view").innerHTML = list.length ? `<div class="games">${list.map(c => `
    <div class="gcard link ${c.backdrop ? "art" : "plainlook"}" data-slug="${esc(c.slug)}" ${c.backdrop ? `style="--art:url('${c.backdrop}')"` : ""}>
      <button class="del" data-del="${esc(c.slug)}" title="Delete this game">🗑</button>
      <div class="gbody">
        ${c.portrait ? `<img class="gport" src="${c.portrait}" alt="">` : ""}
        <div class="gtext">
          <div class="gname">${esc(c.name)}</div>
          <div class="gmeta">${esc(c.system || "")}</div>
          <div class="gmeta">${c.location ? esc(c.location) + " · " : ""}${c.scenes > 1 ? `scene ${c.scenes} · ` : ""}${when(c.last_activity)}</div>
        </div>
      </div>
    </div>`).join("")}</div>` : `
    <div class="welcome ui">
      <div class="strip">${["scifi/orbit", "fantasy/town", "horror/village", "cyberpunk/street"].map(b => `<div style="background-image:url('/static/backdrops/${b}.webp')"></div>`).join("")}</div>
      <h2>Start your first adventure</h2>
      <p class="muted">Pick a game system, describe (or have the GM suggest) where your story begins, and play. The archivist keeps the story straight as it grows.</p>
      <p><button class="primary" onclick="openNewCampaign()">+ New campaign</button></p>
    </div>`;
  document.querySelectorAll(".gcard").forEach(el => el.onclick = () => openCampaign(el.dataset.slug));
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async (e) => {
    e.stopPropagation();
    const name = list.find(c => c.slug === b.dataset.del)?.name;
    if (!confirm(`Delete “${name}”?\n\nIt's moved to the vault's trash folder, so it can be recovered from disk.`)) return;
    try { await api(`/api/campaigns/${b.dataset.del}`, { method: "DELETE" }); showList(); }
    catch (err) { alert(err.message); }
  });
}

// ---- new campaign ----------------------------------------------------------
const OTHER = "__other__";
// Premise suggestions for the campaign being set up: `history` holds every suggestion (with any
// edits made to it), `at` is the one showing. Kept across closing the panel; cleared on create.
let NEW = { seed: "", history: [], at: -1 };

function openNewCampaign() {
  $("modal").innerHTML = `<div class="sheet ui">
    <div class="sheethead"><strong>New campaign</strong><button id="nClose">✕</button></div>
    <label>Name</label><input id="nName" placeholder="Traveller: The Spinward Run">
    <label>Game system / setting</label>
    <select id="nSystemPick"><option value="">Loading what the GM knows…</option></select>
    <div id="nSystemBlurb" class="muted small"></div>
    <input id="nSystem" class="hidden" placeholder="Any game or setting, e.g. Mothership, or your own world">
    <div class="muted small"><a id="nRefresh">↻ ask the GM again</a></div>
    <div class="two">
      <div><label>Writing style</label><select id="nStyle">
        <option value="plain" selected>Plain: practical, matter-of-fact</option>
        <option value="atmospheric">Atmospheric: vivid, moody</option>
        <option value="lighthearted">Lighthearted: real stakes, lots of humour</option>
        <option value="comedic">Comedic: played for laughs</option></select></div>
      <div><label>Reply length</label><select id="nLength">
        <option value="short">Short (~100–150 words)</option>
        <option value="medium" selected>Medium (~150–250 words)</option>
        <option value="long">Long (~250–400 words)</option></select></div>
    </div>
    <label>Premise <span class="muted">(optional): your character, where the story starts, or an idea to build on</span></label>
    <textarea id="nPremise" rows="7" placeholder="Leave blank to let the GM invent the opening, type your own idea, or use Suggest."></textarea>
    <div class="row-actions">
      <button id="nSuggest">✨ Suggest premise</button>
      <button id="nAnother" disabled>↻ Try another</button>
      <span class="histnav"><button id="nPrev" title="Previous suggestion">◀</button><span id="nPos" class="muted small"></span><button id="nNext" title="Next suggestion">▶</button></span>
      <span id="nPremiseMsg" class="muted small"></span>
    </div>
    <div id="nPortraitWrap" class="hidden">
      <label>Portrait <span class="muted">(optional): your character's avatar in the chat</span></label>
      <div class="portraitbox">
        <div id="nPortrait" class="pimg">no portrait yet</div>
        <div>
          <div class="row-actions" style="margin-top:0">
            <button id="nPaint">🎨 Make a portrait</button>
            <button id="nRepaint" disabled>↻ Try another</button>
            <span class="histnav hidden" id="pNav"><button id="pPrev">◀</button><span id="pPos" class="muted small"></span><button id="pNext">▶</button></span>
          </div>
          <label>Appearance <span class="muted">(the GM fills this in; edit it and Try another to change the look, or clear it for someone new)</span></label>
          <textarea id="nAppearance" rows="2"></textarea>
          <div id="nPortraitMsg" class="muted small"></div>
        </div>
      </div>
    </div>
    <label>Extra GM instructions <span class="muted">(optional)</span></label>
    <textarea id="nExtra" rows="2" placeholder="Gritty and grounded. Keep replies under 250 words."></textarea>
    <div class="two">
      <div><label>Consequences</label><select id="nConseq">
        <option value="low">Low-stakes: cinematic, no lasting harm</option>
        <option value="normal" selected>Normal: real setbacks, death only if reckless</option>
        <option value="brutal">Brutal: failure, loss and death when earned</option></select></div>
      <div><label>Dice</label><select id="nDice">
        <option value="auto" selected>Rolled for me, shown in the story</option>
        <option value="virtual">I roll dice on screen</option>
        <option value="manual">I roll my own dice</option>
        <option value="none">No dice: pure narrative</option></select></div>
    </div>
    <label>Look</label><select id="nLook"><option value="auto">Match the game system</option></select>
    <label class="check"><input type="checkbox" id="nRewind"> Allow rewinds: let me edit my last move or re-roll the GM's reply after seeing it</label>
    <div class="muted small">Off keeps outcomes final, like a real table. You can always take a message back while the GM is still replying (Esc).</div>
    <div class="row-actions"><button class="primary" id="create">Create campaign</button><button id="nCancel">Cancel</button></div>
  </div>`;
  $("modal").classList.remove("hidden");
  $("nName").focus();
  const close = () => $("modal").classList.add("hidden");
  $("nClose").onclick = close; $("nCancel").onclick = close;
  $("modal").onclick = (e) => { if (e.target === $("modal")) close(); };
  loadSystems(false);
  api("/api/themes").then(t => { $("nLook").innerHTML += Object.entries(t).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join(""); }).catch(() => {});
  $("nRefresh").onclick = () => loadSystems(true);
  $("nSystemPick").onchange = systemChanged;
  $("nSuggest").onclick = () => suggestPremise(true);
  if (S.imagesEnabled) {
    $("nPortraitWrap").classList.remove("hidden");
    $("nPaint").onclick = () => paintPortrait();
    $("nRepaint").onclick = () => paintPortrait();
    $("pPrev").onclick = () => showPortrait(PORT.at - 1);
    $("pNext").onclick = () => showPortrait(PORT.at + 1);
    if (PORT.at >= 0) showPortrait(PORT.at);
  }
  $("nAnother").onclick = () => suggestPremise(false);
  $("nPrev").onclick = () => showSuggestion(NEW.at - 1);
  $("nNext").onclick = () => showSuggestion(NEW.at + 1);
  if (NEW.at >= 0) $("nPremise").value = NEW.history[NEW.at];
  updateHistNav();
  $("create").onclick = async () => {
    const name = $("nName").value.trim(); if (!name) return $("nName").focus();
    const { slug } = await api("/api/campaigns", { method: "POST", body: JSON.stringify({
      name, system: chosenSystem(), premise: $("nPremise").value, dm_instructions: $("nExtra").value,
      allow_rewind: $("nRewind").checked, consequences: $("nConseq").value, dice: $("nDice").value,
      style: $("nStyle").value, length: $("nLength").value,
      theme: $("nLook").value, genre: SYSTEMS.find(x => x.name === chosenSystem())?.genre || "",
      portrait: PORT.at >= 0 ? PORT.history[PORT.at].token : "",
      tone: SYSTEMS.find(x => x.name === chosenSystem())?.blurb || "",
      appearance: S.imagesEnabled ? $("nAppearance").value : "" }) });
    NEW = { seed: "", history: [], at: -1 };
    PORT = { history: [], at: -1 };
    close(); openCampaign(slug);
  };
}

let SYSTEMS = [];
async function loadSystems(refresh) {
  const pick = $("nSystemPick");
  pick.innerHTML = `<option value="">${refresh ? "Asking the GM again…" : "Loading what the GM knows…"} (first time takes ~30 s)</option>`;
  pick.disabled = true;
  try {
    SYSTEMS = (await api(`/api/suggest/systems${refresh ? "?refresh=1" : ""}`)).systems;
  } catch (e) { SYSTEMS = []; }
  const groups = {};
  for (const s of SYSTEMS) (groups[s.genre || "Other"] ||= []).push(s);
  pick.innerHTML = `<option value="">Choose a game system…</option>` +
    Object.entries(groups).map(([g, items]) => `<optgroup label="${esc(g)}">${items.map(s =>
      `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join("")}</optgroup>`).join("") +
    `<option value="${OTHER}">Other (type your own)…</option>`;
  pick.disabled = false;
  if (!SYSTEMS.length) { pick.value = OTHER; systemChanged(); }
}
function systemChanged() {
  const v = $("nSystemPick").value;
  $("nSystem").classList.toggle("hidden", v !== OTHER);
  if (v === OTHER) $("nSystem").focus();
  $("nSystemBlurb").textContent = SYSTEMS.find(s => s.name === v)?.blurb || "";
}
function chosenSystem() {
  const v = $("nSystemPick").value;
  return v === OTHER ? $("nSystem").value.trim() : v;
}

// "Suggest" builds on whatever is typed (blank = a fresh idea); "Try another" keeps that same
// starting point and asks for something different from the earlier suggestions.
async function suggestPremise(fresh) {
  saveCurrentEdit();
  if (fresh) {
    // a new starting point: whatever is typed now, unless it's just a suggestion being shown
    const typed = $("nPremise").value.trim();
    NEW.seed = NEW.history.includes(typed) ? NEW.seed : typed;
  }
  [$("nSuggest"), $("nAnother"), $("nPrev"), $("nNext")].forEach(b => b.disabled = true);
  $("nPremiseMsg").textContent = "The GM is thinking up a premise…";
  try {
    const r = await api("/api/suggest/premise", { method: "POST", body: JSON.stringify({
      system: chosenSystem(), seed: NEW.seed, avoid: NEW.history, style: $("nStyle").value,
      tone: SYSTEMS.find(x => x.name === chosenSystem())?.blurb || "" }) });
    NEW.history.push(r.premise);
    showSuggestion(NEW.history.length - 1);
    $("nPremiseMsg").textContent = NEW.seed ? "Built on your idea. Edit it freely." : "Edit it freely, or try another.";
  } catch (e) { $("nPremiseMsg").textContent = "Couldn't get a suggestion: " + e.message; }
  $("nSuggest").disabled = false;
  updateHistNav();
}

// Portraits during setup: every attempt is kept (◀ ▶); Try another reuses the appearance text,
// so edit it to steer the look or clear it for a different character.
let PORT = { history: [], at: -1 };
async function paintPortrait() {
  const btns = [$("nPaint"), $("nRepaint")];
  btns.forEach(b => b.disabled = true);
  $("nPortraitMsg").textContent = "The GM describes your character, then it's painted (~10–30 s)…";
  $("nPortrait").textContent = "painting…";
  try {
    const r = await api("/api/suggest/portrait", { method: "POST", body: JSON.stringify({
      system: chosenSystem(), premise: $("nPremise").value, look: $("nLook").value,
      genre: SYSTEMS.find(x => x.name === chosenSystem())?.genre || "",
      appearance: $("nAppearance").value, avoid: PORT.history.map(p => p.prompt) }) });
    PORT.history.push(r);
    showPortrait(PORT.history.length - 1);
    $("nPortraitMsg").textContent = "";
  } catch (e) {
    $("nPortraitMsg").textContent = "Couldn't paint it: " + e.message;
    if (PORT.at < 0) $("nPortrait").textContent = "no portrait yet";
  }
  $("nPaint").disabled = false;
  $("nRepaint").disabled = !PORT.history.length;

function saveCurrentEdit() {

}
function showSuggestion(i) {

// A different premise means a different character: forget the appearance the GM wrote for the
// old one, so the next portrait is described from the new premise (the current image stays).
function premiseChanged() {
  if (!$("nAppearance") || !$("nAppearance").value) return;
  $("nAppearance").value = "";

function updateHistNav() {

function sceneFor(id) {

  for (const s of S.data.scenes) if (id >= s.start) sc = s;

// A turn "failed" when the player's message got no reply, or an empty one (an error, or it
// was stopped). Only then is Retry offered; editing after a real reply needs rewinds allowed.
function lastTurnFailed() {
  const last = S.data.messages[S.data.messages.length - 1];
  return !!last && (last.role === "user" || !last.content.trim());
}
function canEditLast() { return S.data.can_rewind || lastTurnFailed(); }

function rollHTML(r) {
  const mod = r.modifier ? ` ${r.modifier > 0 ? "+" : "−"} ${Math.abs(r.modifier)}` : "";
  const res = "target" in r ? ` vs ${r.target}${r.success_if === "at_most" ? "−" : "+"} ${r.success ? "✓ success" : "✗ failure"}` : "";
  return `<div class="roll ${"success" in r ? (r.success ? "ok" : "fail") : ""}">🎲 <strong>${esc(r.reason || "Roll")}</strong> · ${esc(r.dice)}: ${r.rolls.join(" + ")}${mod} = <strong>${r.total}</strong>${res}</div>`;
}
function rollsHTML(rolls) { return rolls?.length ? `<div class="rolls">${rolls.map(rollHTML).join("")}</div>` : ""; }

// ---- dice shapes ------------------------------------------------------------
const DIE_SHAPES = {
  4: '<polygon points="50,6 95,88 5,88"/>',
  6: '<rect x="8" y="8" width="84" height="84" rx="14"/>',
  8: '<polygon points="50,4 95,50 50,96 5,50"/><line x1="5" y1="50" x2="95" y2="50"/>',
  10: '<polygon points="50,4 93,40 50,96 7,40"/><line x1="7" y1="40" x2="93" y2="40"/>',
  12: '<polygon points="50,4 95,37 78,93 22,93 5,37"/>',
  20: '<polygon points="50,3 93,27 93,73 50,97 7,73 7,27"/><polygon points="50,22 76,66 24,66" fill="none"/>',
};
function dieSVG(sides, value) {
  const shape = DIE_SHAPES[sides] || '<circle cx="50" cy="50" r="44"/>';
  const label = value ?? (sides === 100 ? "%" : "?");
  return `<svg class="die" viewBox="0 0 100 100" data-sides="${sides}">${shape}<text x="50" y="${sides === 4 ? 62 : 52}">${label}</text></svg>`;
}
function parseDice(notation) {
  const m = /^(\d*)D(\d+)([+-]\d+)?$/i.exec(notation || "");
  return m ? { count: +(m[1] || 1), sides: +m[2], mod: +(m[3] || 0) } : { count: 1, sides: 20, mod: 0 };
}
function needText(r) {
  return "target" in r ? `need ${r.target}${r.success_if === "at_most" ? " or less" : "+"}` : "";
}
function rollRequestHTML(req, live) {
  const d = parseDice(req.dice);
  const shown = Math.min(d.count, 6);
  return `<div class="rollreq ${live ? "live" : ""}" data-roll="${esc(req.id)}">
    <div class="rq-title">🎲 ${esc(req.prompt)}</div>
    <div class="muted">${esc(req.dice)}${needText(req) ? " · " + needText(req) : ""}${live ? "" : " · rolled"}</div>
    <div class="rq-dice">${Array.from({ length: shown }, () => dieSVG(d.sides)).join("")}${d.count > shown ? `<span class="muted">+${d.count - shown} more</span>` : ""}
      ${live ? `<button class="primary" data-act="roll">🎲 Roll</button>` : ""}</div>
  </div>`;
}
function rolledHTML(r) {
  const d = parseDice(r.dice);
  const mod = r.modifier ? ` ${r.modifier > 0 ? "+" : "−"} ${Math.abs(r.modifier)}` : "";
  const res = "success" in r ? `<span class="res ${r.success ? "ok" : "fail"}">${r.success ? "✓ success" : "✗ failure"}</span>` : "";
  return `<div class="rolled">🎲 <strong>${esc(r.reason || "Roll")}</strong> ${r.rolls.map(v => dieSVG(d.sides, v)).join("")}${mod} = <strong>${r.total}</strong> ${needText(r) ? `<span class="muted">(${needText(r)})</span>` : ""} ${res}</div>`;
}

// The people named in a GM message who have a portrait, in order of first mention (up to 3).
function peopleIn(text) {
  const out = [];
  for (const p of S.data.people_art || []) {
    let at = -1;
    for (const n of p.names) {
      if (n.length < 3 || n[0] !== n[0].toUpperCase()) continue;
      const m = new RegExp(`(^|[^\\w])${n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?![\\w])`).exec(text || "");
      if (m && (at < 0 || m.index < at)) at = m.index;
    }
    if (at >= 0) out.push([at, p]);
  }
  return out.sort((a, b) => a[0] - b[0]).slice(0, 3).map(x => x[1]);
}
function msgHTML(m, isLastUser, isLastGm) {
  if (m.role === "user" && m.roll) {
    const bubble = `<div class="msg user" data-id="${m.id}">${rolledHTML(m.roll)}</div>`;
    return S.data.portrait
      ? `<div class="urow">${bubble}<img class="avatar" alt="" src="/api/campaigns/${S.slug}/portraits/${S.data.portrait}"></div>`
      : bubble;
  }
  if (m.role === "user") {
    const unanswered = S.data.messages[S.data.messages.length - 1] === m;
    const btns = [];
    if (isLastUser && !S.busy && canEditLast()) btns.push(`<button data-act="edit">Edit</button>`);
    if (unanswered && !S.busy) btns.push(`<button data-act="retry">↻ Retry</button>`);
    const bubble = `<div class="msg user" data-id="${m.id}">${md(m.content)}
      ${btns.length ? `<div class="meta actions">${btns.join(" ")}</div>` : ""}</div>`;
    return S.data.portrait
      ? `<div class="urow">${bubble}<img class="avatar" alt="" title="Your character (open the sheet)" src="/api/campaigns/${S.slug}/portraits/${S.data.portrait}"></div>`
      : bubble;
  }
  const chips = [];
  if (m.injected?.length) chips.push(`<span class="chip" title="${esc(m.injected.join(", "))}">📜 ${m.injected.length} from archive</span>`);
  if (m.stats?.prompt_tokens) {
    const st = m.stats, pct = Math.round(100 * st.cached_tokens / st.prompt_tokens);
    chips.push(`<span class="chip" title="prompt ${st.prompt_tokens} tokens, ${st.cached_tokens} from cache, prefill ${(st.prompt_ms / 1000).toFixed(1)}s, reply ${st.completion_tokens} tokens in ${st.seconds}s">⚡ ${(st.prompt_tokens / 1000).toFixed(1)}k ctx · ${pct}% cached</span>`);
  }
  if (m.stats?.total != null || m.stats?.seconds != null) {
    const st = m.stats, total = st.total ?? st.seconds;
    const tip = [st.first_word != null ? `first words after ${st.first_word}s` : null,
                 st.archive_check != null ? `archive check ${st.archive_check}s` : null,
                 `GM ${st.seconds}s`].filter(Boolean).join(", ");
    chips.push(`<span class="chip" title="${tip}">⏱ ${total}s</span>`);
  }
  if (m.tools?.length) chips.push(`<span class="chip" title="${esc(m.tools.map(t => t.tool + " " + t.arguments).join("\n"))}">🔎 ${m.tools.length} lookup${m.tools.length > 1 ? "s" : ""}</span>`);
  const npcs = peopleIn(m.content);
  return `<div class="msg assistant" data-id="${m.id}">
    ${npcs.length ? `<div class="npcs">${npcs.map(p => `<img src="/api/campaigns/${S.slug}/people/art/${p.file}" alt="${esc(p.name)}" title="${esc(p.name)}" data-person="${esc(p.name)}">`).join("")}</div>` : ""}
    ${m.reasoning ? `<details class="think"><summary>thinking</summary><div>${esc(m.reasoning)}</div></details>` : ""}
    ${rollsHTML(m.rolls)}
    <div class="body">${md(m.content)}</div>
    ${m.roll_request ? rollRequestHTML(m.roll_request, isLastGm && !S.busy) : ""}
    <div class="meta">${chips.join("")}${isLastGm && !S.busy && (!m.content.trim() || S.data.can_rewind) ? `<span class="actions"><button data-act="regen" title="${m.content.trim() ? "Rewind: ask the GM again for this turn" : "Retry this turn"}">↻ ${m.content.trim() ? "Re-roll" : "Retry"}</button></span>` : ""}</div>
  </div>`;
}

// ---- looks & backdrops ----------------------------------------------------------------
const FONTS = { scifi: "Exo+2:wght@500", fantasy: "Cinzel:wght@500", horror: "IM+Fell+English", cyberpunk: "Share+Tech+Mono" };
let LOOK = { theme: null, url: null, front: "bdA" };
function setLook(theme) {
  const themed = theme && S.data?.themes?.[theme];
  if (!themed) { delete document.body.dataset.look; LOOK = { theme: null, url: null, front: "bdA" };
    $("artBtn").classList.add("hidden"); delete document.body.dataset.viewart;
    ["bdA", "bdB"].forEach(id => { $(id).classList.remove("on"); $(id).style.backgroundImage = ""; }); return; }
  document.body.dataset.look = theme;
  $("artBtn").classList.remove("hidden");
  if (FONTS[theme] && !document.getElementById("font-" + theme)) {
    const l = document.createElement("link"); l.id = "font-" + theme; l.rel = "stylesheet";
    l.href = `https://fonts.googleapis.com/css2?family=${FONTS[theme]}&display=swap`;
    document.head.appendChild(l);
  }
  LOOK.theme = theme;
  updateBackdrop();
}
function updateBackdrop() {
  if (!LOOK.theme || !S.data) return;
  const kinds = S.data.themes[LOOK.theme].settings;
  const cur = S.data.scenes[S.data.scenes.length - 1];
  const setting = kinds.includes(cur?.setting) ? cur.setting : kinds[0];
  const url = `/static/backdrops/${LOOK.theme}/${setting}.webp`;
  if (url === LOOK.url) return;
  LOOK.url = url;
  const img = new Image();
  img.onload = () => {
    if (LOOK.url !== url) return;  // superseded while loading
    const back = LOOK.front === "bdA" ? "bdB" : "bdA";
    $(back).style.backgroundImage = `url("${url}")`;
    $(back).classList.add("on"); $(LOOK.front).classList.remove("on");
    LOOK.front = back;
  };
  img.src = url;
}

function renderChat(scroll) {
  const msgs = S.data.messages;
  const start = Math.max(0, msgs.length - S.shown);
  const lastUser = [...msgs].reverse().find(m => m.role === "user");
  const last = msgs[msgs.length - 1];
  let html = start > 0 ? `<button id="more" class="ui">Show earlier (${start})</button>` : "";
  if (!msgs.length) html += `<div class="card ui muted">${md(S.data.meta.premise || "")}<p>Describe your first move to begin.</p></div>`;
  let curScene = null, open = false;
  for (const m of msgs.slice(start)) {
    const sc = sceneFor(m.id);
    if (sc && sc !== curScene) {
      if (open) html += "</div>";
      curScene = sc;
      const tag = sc.status === "compacted" ? " · filed" : sc.status === "closed_provisional" ? " · closed" : "";
      html += `<div class="divider">Scene ${sc.id}${sc.title ? " · " + esc(sc.title) : ""}${sc.location ? " · " + esc(sc.location) : ""}${tag}</div>`;
      html += `<div class="${sc.status === "compacted" ? "filed" : ""}">`; open = true;
    }
    html += msgHTML(m, m === lastUser, m === last && m.role === "assistant");
  }
  if (open) html += "</div>";
  $("view").innerHTML = html;
  updateBackdrop();
  $("more")?.addEventListener("click", () => { S.shown += 150; renderChat(false); });
  $("view").querySelectorAll("[data-act=regen]").forEach(b => b.onclick = regenerate);
  $("view").querySelectorAll(".avatar").forEach(a => a.onclick = () => openPanel("character"));
  $("view").querySelectorAll("[data-person]").forEach(a => a.onclick = () => showPortrait(a.dataset.person));
  $("view").querySelectorAll(".rollreq.live").forEach(card => {
    const go = () => rollDice(card.dataset.roll);
    card.querySelector("[data-act=roll]").onclick = go;
    card.querySelectorAll(".die").forEach(d => d.onclick = go);
  });
  $("view").querySelectorAll("[data-act=retry]").forEach(b => b.onclick = () => runTurn(`/api/campaigns/${S.slug}/regenerate`, null, null, "regenerate"));
  $("view").querySelectorAll("[data-act=edit]").forEach(b => b.onclick = () => editLast(lastUser));
  if (scroll) $("main").scrollTop = $("main").scrollHeight;
}

function setBusy(b) {
  S.busy = b;
  $("send").textContent = b ? "Stop" : "Send";
  $("send").classList.toggle("primary", !b);
  $("send").title = b ? "Stop the reply and take your message back (Esc)" : "";
}

// Esc / Stop: cancel the turn. For a new or edited message the message is withdrawn and put
// back in the box to finish; for a regenerate the reply just stops (Retry is offered).
async function cancelTurn() {
  if (!S.busy || !S.abort) return;
  const turn = S.turn;
  if (turn.kind !== "regenerate" && turn.kind !== "roll") {
    S.cancelling = (async () => {
      try {
        const r = await api(`/api/campaigns/${S.slug}/unsend`, { method: "POST" });
        $("input").value = r.content; autosize(); $("input").focus();
        return "Message taken back: finish it and send again.";
      } catch (e) { return e.message; }
    })();
  }
  S.abort.abort();
}

async function runTurn(path, body, optimisticUser, kind = "chat", extra = {}) {
  if (S.busy) return;
  setBusy(true);
  S.sentAt = Date.now();
  S.abort = new AbortController();
  S.turn = { kind };
  if (optimisticUser) S.data.messages.push({ id: Infinity, role: "user", content: optimisticUser });
  renderChat(true);
  const box = document.createElement("div");
  box.className = "msg assistant";
  box.innerHTML = `<details class="think hidden"><summary>thinking…</summary><div></div></details><div class="rolls hidden"></div><div class="body"><span class="muted ui">…</span></div><div class="meta"></div>`;
  $("view").appendChild(box);
  $("main").scrollTop = $("main").scrollHeight;
  let text = "", think = "";
  const nearBottom = () => $("main").scrollHeight - $("main").scrollTop - $("main").clientHeight < 120;
  try {
    await streamPost(path, body, {
      status: (e) => { $("statusline").textContent = e.text; },
      context: (e) => {
        const n = (e.injected || []).length;
        $("statusline").textContent = n ? `archive: ${n} note${n > 1 ? "s" : ""} added (${e.seconds}s)` : "";
      },
      reasoning: (e) => {
        const d = box.querySelector(".think"); d.classList.remove("hidden");
        think += e.text; d.querySelector("div").textContent = think;
      },
      content: (e) => {
        const stick = nearBottom();
        text += e.text; box.querySelector(".body").innerHTML = md(text);
        box.querySelector(".think summary").textContent = "thinking";
        if (stick) $("main").scrollTop = $("main").scrollHeight;
      },
      tool: (e) => { $("statusline").textContent = `GM is checking the archive: ${e.name} ${e.arguments}`; },
      roll: (e) => { const rb = box.querySelector(".rolls"); rb.classList.remove("hidden"); rb.insertAdjacentHTML("beforeend", rollHTML(e)); },
      error: (e) => { throw new Error(e.text); },
      done: () => {},
      ...extra,
    }, S.abort.signal);
  } catch (err) {
    if (err.name !== "AbortError") $("statusline").innerHTML = `<span class="error">Error: ${esc(err.message)}</span>`;
  }
  S.abort = null;
  if (S.cancelling) {  // refresh only once the unsend has landed
    const msg = await S.cancelling;
    S.cancelling = null;
    $("statusline").textContent = msg;
  }
  S.data = await api(`/api/campaigns/${S.slug}`);
  updatePanels(S.data.panels);
  setBusy(false);
  renderChat(nearBottom());
  startPoll();
}

function send() {
  // a quick second click (or tap) on Send lands on "Stop": ignore it rather than take the
  // message back
  if (S.busy) return Date.now() - (S.sentAt || 0) < 2000 ? undefined : cancelTurn();
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = ""; autosize();
  if (S.editing) {  // resend the last message: replaces that exchange
    const i = S.data.messages.indexOf(S.editing);
    stopEditing();
    if (i >= 0) S.data.messages = S.data.messages.slice(0, i);
    return runTurn(`/api/campaigns/${S.slug}/edit`, { content: text }, text, "edit");
  }
  runTurn(`/api/campaigns/${S.slug}/chat`, { content: text }, text);
}
// ---- the player rolls the GM's requested dice ------------------------------------------
// The tumble across the screen: land(r) settles the dice on the result, cancel() clears them.
function diceFly(d) {
  const shown = Math.min(d.count, 6);
  const fly = document.createElement("div");
  fly.className = "dicefly";
  fly.innerHTML = `<div class="row">${Array.from({ length: shown }, (_, i) => dieSVG(d.sides).replace('class="die"', `class="die" style="animation-delay:${i * 90}ms"`)).join("")}</div><div class="banner"></div>`;
  document.body.appendChild(fly);
  const faces = [...fly.querySelectorAll(".die text")];
  const flicker = setInterval(() => faces.forEach(t => t.textContent = 1 + Math.floor(Math.random() * d.sides)), 70);
  const t0 = Date.now();
  let settled = false;
  return {
    land(r) {
      if (settled) return; settled = true;
      setTimeout(() => {
        clearInterval(flicker);
        faces.forEach((t, i) => t.textContent = r.rolls[i] ?? "");
        const banner = fly.querySelector(".banner");
        const mod = r.modifier ? ` ${r.modifier > 0 ? "+" : "−"} ${Math.abs(r.modifier)}` : "";
        banner.textContent = `${r.rolls.length > 1 || r.modifier ? r.rolls.join(" + ") + mod + " = " : ""}${r.total}` +
          ("success" in r ? (r.success ? "  ✓ success" : "  ✗ failure") : "");
        banner.classList.add("show", ...("success" in r ? [r.success ? "ok" : "fail"] : []));
        setTimeout(() => { fly.classList.add("fade"); setTimeout(() => fly.remove(), 600); }, 1800);
      }, Math.max(0, 1250 - (Date.now() - t0)));
    },
    cancel() { if (!settled) { settled = true; clearInterval(flicker); fly.remove(); } },
  };
}
function rollDice(id) {
  if (S.busy) return;
  const last = S.data.messages[S.data.messages.length - 1];
  const req = last?.roll_request;
  if (!req || req.id !== id) return;
  const fly = diceFly(parseDice(req.dice));
  runTurn(`/api/campaigns/${S.slug}/roll`, { id }, `🎲 ${req.prompt}…`, "roll", { rolled: (e) => fly.land(e.roll) })
    .finally(() => fly.cancel());
}

// ---- dice tray: any dice, for fun or as your move ------------------------------------------
const TRAY = { sides: 20, count: 1, mod: 0 };
function trayNotation() { return `${TRAY.count}D${TRAY.sides === 100 ? 100 : TRAY.sides}${TRAY.mod ? (TRAY.mod > 0 ? "+" : "") + TRAY.mod : ""}`; }
function drawTray() {
  $("traySides").innerHTML = [4, 6, 8, 10, 12, 20, 100].map(n =>
    `<button data-s="${n}" class="${n === TRAY.sides ? "on" : ""}" title="d${n}">${dieSVG(n, n === 100 ? "%" : n)}</button>`).join("");
  $("traySides").querySelectorAll("[data-s]").forEach(b => b.onclick = () => { TRAY.sides = +b.dataset.s; drawTray(); });
  $("trayCount").textContent = TRAY.count;
  $("trayMod").textContent = TRAY.mod > 0 ? "+" + TRAY.mod : TRAY.mod;
  $("trayNotation").textContent = trayNotation();
  $("traySend").disabled = S.busy;
}
function openTray() {
  if (!$("tray").classList.contains("hidden")) return closeTray();
  // the GM is waiting on a roll: start from its dice and reason
  const req = S.data?.messages?.[S.data.messages.length - 1]?.roll_request;
  if (req) {
    const d = parseDice(req.dice);
    Object.assign(TRAY, { sides: d.sides, count: d.count, mod: d.mod });
    $("trayReason").value = req.prompt || "";
  }
  $("trayResult").textContent = "";
  drawTray();
  $("tray").classList.remove("hidden");
}
function closeTray() { $("tray").classList.add("hidden"); }
document.querySelectorAll("#tray [data-n]").forEach(b => b.onclick = () => { TRAY.count = Math.min(10, Math.max(1, TRAY.count + +b.dataset.n)); drawTray(); });
document.querySelectorAll("#tray [data-m]").forEach(b => b.onclick = () => { TRAY.mod = Math.min(20, Math.max(-20, TRAY.mod + +b.dataset.m)); drawTray(); });
$("trayClose").onclick = closeTray;
$("lightbox").onclick = (e) => { if (e.target === $("lightbox")) closePortrait(); };
$("lbImg").onclick = closePortrait;
$("diceBtn").onclick = openTray;
$("trayFun").onclick = () => {
  const rolls = Array.from({ length: TRAY.count }, () => 1 + Math.floor(Math.random() * TRAY.sides));
  const r = { dice: trayNotation(), rolls, modifier: TRAY.mod, total: rolls.reduce((a, b) => a + b, 0) + TRAY.mod };
  diceFly({ count: TRAY.count, sides: TRAY.sides }).land(r);
  $("trayResult").textContent = ` → ${r.rolls.join(" + ")}${r.modifier ? (r.modifier > 0 ? " + " : " − ") + Math.abs(r.modifier) : ""} = ${r.total} (just for fun)`;
};
$("traySend").onclick = () => {
  if (S.busy) return;
  const reason = $("trayReason").value.trim();
  const fly = diceFly({ count: TRAY.count, sides: TRAY.sides });
  closeTray();
  $("trayReason").value = "";
  runTurn(`/api/campaigns/${S.slug}/roll-free`, { dice: trayNotation(), reason }, `🎲 ${reason || trayNotation()}…`, "roll",
          { rolled: (e) => fly.land(e.roll) }).finally(() => fly.cancel());
};

function regenerate() {
  S.data.messages = S.data.messages.slice(0, -1);
  runTurn(`/api/campaigns/${S.slug}/regenerate`, null, null, "regenerate");
}
function startEditing() {
  const m = [...S.data.messages].reverse().find(x => x.role === "user");
  if (!m) return;
  if (!canEditLast()) {
    $("statusline").textContent = "Rewinds are off for this campaign: the GM's reply stands.";
    return;
  }
  S.editing = m;
  $("input").value = m.content; autosize();
  $("input").setSelectionRange(m.content.length, m.content.length);
  $("view").querySelector(`.msg.user[data-id="${m.id}"]`)?.classList.add("editing");
  $("statusline").textContent = "Editing your last message: Enter resends it (replacing the GM's reply), Esc cancels.";
}
function stopEditing() {
  $("view").querySelector(".msg.user.editing")?.classList.remove("editing");
  S.editing = null; $("statusline").textContent = "";
}
function editLast(m) {
  const el = $("view").querySelector(`.msg.user[data-id="${m.id}"]`);
  el.innerHTML = `<textarea rows="4">${esc(m.content)}</textarea>
    <div class="meta actions"><button class="primary" data-act="save">Resend</button><button data-act="cancel">Cancel</button></div>`;
  el.querySelector("textarea").focus();
  el.querySelector("[data-act=cancel]").onclick = () => renderChat(false);
  el.querySelector("[data-act=save]").onclick = () => {
    const content = el.querySelector("textarea").value.trim(); if (!content) return;
    const i = S.data.messages.indexOf(m);
    S.data.messages = S.data.messages.slice(0, i);
    runTurn(`/api/campaigns/${S.slug}/edit`, { content }, content, "edit");
  };
}

// ---- status polling ------------------------------------------------------
function updateStatus(st, scenes) {
  if (S.busy) return;
  const cur = scenes[scenes.length - 1];
  const bits = [`Scene ${cur.id}${cur.location ? " · " + cur.location : ""}`];
  const details = S.data.show_details;  // off by default: just where you are
  if (details && st.tracking) bits.push("archivist reading…");
  else if (details && st.last_verdict && Date.now() / 1000 - st.last_verdict.at < 60)
    bits.push(st.last_verdict.transition ? `scene change? ${Math.round(st.last_verdict.confidence * 100)}%` : "same scene");
  if (st.compacting) bits.push("filing old scenes…");
  if (details && st.condensing) bits.push("condensing the start of this session…");
  if (details && st.last_sheet && Date.now() / 1000 - st.last_sheet.at < 90) bits.push(`📝 sheet: ${st.last_sheet.changes.join("; ")}`);
  if (details && st.last_cast && Date.now() / 1000 - st.last_cast.at < 90) bits.push(`👥 ${st.last_cast.changes.join("; ")}`);
  if (st.cast_catchup) bits.push(`reading the story for people… ${Math.round(100 * st.cast_catchup.done / Math.max(1, st.cast_catchup.total))}%`);
  updatePanels(st.panels);
  if (st.people_art && JSON.stringify(st.people_art) !== JSON.stringify(S.data.people_art)) {
    S.data.people_art = st.people_art; renderChat(false);
  }
  if (st.error) bits.push(`⚠ ${st.error}`);
  $("statusline").textContent = bits.join(" · ");
  $("statusline").title = bits.join(" · ");
}
function startPoll() {
  clearInterval(S.poll);
  let n = 0;
  S.poll = setInterval(async () => {
    if (!S.slug || S.busy) return;
    try {
      const st = await api(`/api/campaigns/${S.slug}/status`);
      const changed = JSON.stringify(st.scenes) !== JSON.stringify(S.data.scenes);
      S.data.scenes = st.scenes; S.data.status = st;
      updateStatus(st, st.scenes);
      if (changed) renderChat(false);
      if (!st.tracking && !st.compacting && !st.casting && ++n > 6) clearInterval(S.poll);
    } catch {}
  }, 3000);
}

// ---- side panels: character, gear, people, places, journal, archive -------------------------
// The rail's icons open one panel at a time in the drawer. Each panel has a fingerprint from the
// server (S.data.panels); a dot marks the ones that changed since the player last looked.
const PANELS = {
  character: { title: "Character", render: () => renderSheet("character") },
  gear: { title: "Gear", render: () => renderSheet("gear") },
  people: { title: "People", render: renderPeople },
  places: { title: "Places", render: renderPlaces },
  journal: { title: "Journal", render: renderJournal },
  archive: { title: "Archive", render: renderArchive },
};
const SHEET_PARTS = {
  character: ["name", "concept", "appearance", "condition", "skills", "companions"],
  gear: ["money", "gear", "assets"],
};
const SHEET_LABELS = { name: "Name", concept: "Concept", appearance: "Appearance", skills: "Skills", condition: "Condition (injuries, status)",
  money: "Money", gear: "Gear", assets: "Assets (ships, vehicles, property)", companions: "Companions",
  obligations: "Obligations (debts, promises, deadlines)" };
let PANEL = null;  // the open panel's name
let PSIG = {};  // the latest panel fingerprints

function seenKey() { return "seen:" + S.slug; }
function getSeen() { try { return JSON.parse(localStorage.getItem(seenKey()) || "null"); } catch { return null; } }
function setSeen(v) { try { localStorage.setItem(seenKey(), JSON.stringify(v)); } catch {} }
function markSeen(name) {
  const sig = PSIG[name];
  if (!sig) return;
  const seen = getSeen() || {};
  seen[name] = sig; setSeen(seen);
}
// Called whenever fresh fingerprints arrive: light the dots, refresh the open panel if its
// contents changed underneath it (unless the player is typing in it).
function updatePanels(sigs) {
  if (!S.slug || !sigs) return;
  const prev = PSIG;
  PSIG = sigs;
  let seen = getSeen();
  if (!seen) { seen = { ...sigs }; setSeen(seen); }  // first visit: nothing is "new"
  for (const b of document.querySelectorAll("#rail [data-panel]")) {
    const k = b.dataset.panel;
    b.classList.toggle("changed", !!sigs[k] && seen[k] !== undefined && seen[k] !== sigs[k] && PANEL !== k);
    if (!(k in seen) && sigs[k]) { seen[k] = sigs[k]; setSeen(seen); }
  }
  if (PANEL && sigs[PANEL] && prev[PANEL] !== sigs[PANEL]) {
    markSeen(PANEL);
    const typing = $("drawerBody").contains(document.activeElement) &&
      /INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if (!typing && !$("drawerBody").querySelector(".editing-person")) PANELS[PANEL].render();
  }
}

function openPanel(name) {
  if (PANEL === name && $("drawer").classList.contains("open")) return closePanel();
  PANEL = name;
  $("drawerTitle").textContent = PANELS[name].title;
  $("drawerBody").innerHTML = `<p class="muted">Loading…</p>`;
  $("drawer").classList.add("open");
  document.body.dataset.drawer = name;
  document.querySelectorAll("#rail [data-panel]").forEach(b => b.classList.toggle("on", b.dataset.panel === name));
  markSeen(name);
  updatePanels(PSIG);
  PANELS[name].render();
  try { localStorage.setItem("panel:" + S.slug, name); } catch {}
}
function closePanel() {
  PANEL = null;
  $("drawer").classList.remove("open");
  delete document.body.dataset.drawer;
  document.querySelectorAll("#rail [data-panel]").forEach(b => b.classList.remove("on"));
  try { localStorage.removeItem("panel:" + S.slug); } catch {}
}
function setPinned(on) {
  if (on) document.body.dataset.pinned = "1"; else delete document.body.dataset.pinned;
  $("pinBtn").classList.toggle("on", on);
  $("pinBtn").title = on ? "Unpin: the panel closes over the chat again" : "Keep this panel open beside the chat";
  try { localStorage.setItem("pinned", on ? "1" : ""); } catch {}
}
// Wide screens: the rail floats at the right edge. Narrow: it sits in the footer by the status.
function placeRail() {
  const narrow = matchMedia("(max-width: 900px)").matches;
  const rail = $("rail");
  if (narrow && rail.parentElement !== $("railSlot")) $("railSlot").appendChild(rail);
  if (!narrow && rail.parentElement !== document.body) document.body.insertBefore(rail, $("modal"));
}
matchMedia("(max-width: 900px)").addEventListener("change", placeRail);

// ---- character and gear: views of the sheet ---------------------------------------------------
async function renderSheet(part) {
  const d = await api(`/api/campaigns/${S.slug}/character`);
  if (PANEL !== part) return;
  const withPortrait = part === "character" && (S.imagesEnabled || S.data.portrait);
  const pt = withPortrait ? await api(`/api/campaigns/${S.slug}/portraits`) : null;
  const sh = d.sheet || {};
  const fields = SHEET_PARTS[part];
  $("drawerBody").innerHTML = `
    ${pt ? `<div class="portraitbox">
      <div class="pimg" id="shPortrait" style="${pt.current ? `background-image:url('/api/campaigns/${S.slug}/portraits/${pt.current}')` : ""}">${pt.current ? "" : "no portrait"}</div>
      <div>${pt.enabled ? `<button id="shPaint">🎨 New portrait</button><div class="muted small">Uses the Appearance below: edit it first to change the look.</div>` : ""}
        <div id="shPaintMsg" class="muted small"></div>
        ${pt.all.length > 1 ? `<div class="thumbs">${pt.all.map(n => `<img src="/api/campaigns/${S.slug}/portraits/${n}" data-name="${n}" class="${n === pt.current ? "cur" : ""}" title="Use this one">`).join("")}</div>` : ""}
      </div></div>` : ""}

    ${sheetFieldsHTML(fields, sh, d.lists)}
    <p><button class="primary" id="saveSheet">Save</button> <span id="sheetMsg" class="muted"></span></p>
    <h3>Recent changes</h3>
    ${d.history.length ? `<ul>${d.history.map(h => `<li>${esc(h.what)} <span class="muted">· ${new Date(h.ts * 1000).toLocaleString()}</span></li>`).join("")}</ul>` : `<p class="muted">none yet</p>`}
    <p class="muted">The archivist updates the sheet after each GM reply (money, gear, injuries, companions, debts). The GM sees it every turn and keeps to it.</p>`;
  $("shPaint")?.addEventListener("click", async () => {
    $("shPaint").disabled = true; $("shPaintMsg").textContent = "Painting… (~10–30 s)";
    try {
      const appearance = $("drawerBody").querySelector("[data-f=appearance]")?.value || "";
      const r = await api(`/api/campaigns/${S.slug}/portraits`, { method: "POST", body: JSON.stringify({ appearance }) });
      S.data.portrait = r.current; renderChat(false); renderSheet(part);
    } catch (e) { $("shPaintMsg").textContent = e.message; $("shPaint").disabled = false; }
  });
  $("drawerBody").querySelectorAll(".thumbs img").forEach(img => img.onclick = async () => {

    S.data.portrait = img.dataset.name; renderChat(false); renderSheet(part);
  });
  $("saveSheet").onclick = () => saveSheetFields(sh, () => renderSheet(part));
}
function sheetFieldsHTML(fields, sh, lists) {
  return fields.map(f => lists.includes(f)
    ? `<label>${SHEET_LABELS[f] || f} <span class="muted">(one per line)</span></label><textarea data-f="${f}" rows="${Math.max(2, (sh[f] || []).length + 1)}">${esc((sh[f] || []).join("\n"))}</textarea>`
    : `<label>${SHEET_LABELS[f] || f}</label><input data-f="${f}" value="${esc(sh[f] || "")}">`).join("");
}
// Each panel edits only its own fields: merge them into the latest sheet before saving.
async function saveSheetFields(old, done) {
  const body = { ...((await api(`/api/campaigns/${S.slug}/character`)).sheet || old) };
  $("drawerBody").querySelectorAll("[data-f]").forEach(el => {
    body[el.dataset.f] = el.tagName === "TEXTAREA" ? el.value.split("\n").map(x => x.trim()).filter(Boolean) : el.value;
  });
  try {
    await api(`/api/campaigns/${S.slug}/character`, { method: "PUT", body: JSON.stringify(body) });
    await refreshSigs(); done();
  } catch (e) { $("sheetMsg").textContent = e.message; }
}
async function refreshSigs() {
  try { const st = await api(`/api/campaigns/${S.slug}/status`); PSIG = st.panels; markSeen(PANEL); updatePanels(st.panels); } catch {}
}

// ---- people ----------------------------------------------------------------------------------
const PERSON_FIELDS = [["pronouns", "Pronouns"], ["role", "Role"], ["look", "Looks"], ["where", "Where"], ["standing", "Attitude to you"]];
let PEOPLE = [], PEOPLE_FOCUS = null, PEOPLE_IMAGES = false;
async function renderPeople() {
  const d = await api(`/api/campaigns/${S.slug}/people`);
  if (PANEL !== "people") return;
  PEOPLE = d.people; PEOPLE_IMAGES = d.images;
  const behind = d.latest - d.until;

    ? `<p class="muted">Reading the story for people… (${Math.round(100 * d.catching_up.done / Math.max(1, d.catching_up.total))}%)</p>`
    : d.reading ? `<p class="muted">Reading the latest turn…</p>`
    : d.painting ? `<p class="muted">Painting portraits…</p>`
    : behind > 4 ? `<p class="muted">${d.until ? "Some of the story hasn't been read for people yet." : "This campaign started before the People list: the archivist can read the story so far to fill it in."} <button id="readPeople">Read the story</button></p>` : "";
  $("drawerBody").innerHTML = `
    ${progress}

    <div id="peopleList"></div>
    <p><button id="addPerson">+ Add someone</button></p>
    <p class="muted">Everyone your character has met. The archivist adds people after each GM reply; their pronouns, looks and role are kept as first described, so the GM stays consistent. Fix anything that's wrong with Edit: the GM sees people in play every turn.</p>`;
  drawPeople("");

}
function sceneOfMsg(id) { const sc = sceneFor(id); return sc ? sc.id : null; }
function drawPeople(filter) {
  const q = filter.trim().toLowerCase();
  const shown = PEOPLE.map((p, i) => [p, i]).filter(([p]) => !q || JSON.stringify(p).toLowerCase().includes(q));
  $("peopleList").innerHTML = shown.map(([p, i]) => {
    const seen = p.last ? sceneOfMsg(p.last) : null;
    return `<div class="pcard" data-i="${i}">
      <div class="ptop"><div class="pwho">${p.portrait ? `<img class="pport" data-zoom="${esc(p.name)}" src="/api/campaigns/${S.slug}/people/art/${p.portrait}" alt="" title="Click to see it bigger">` : ""}
          <div><span class="pname">${esc(p.name || "(new)")}</span>${p.pronouns ? ` <span class="muted">· ${esc(p.pronouns)}</span>` : ""}</div></div>
        <span>${PEOPLE_IMAGES && p.name ? `<button class="edit" data-paint="${i}" title="${p.portrait ? "Paint a new portrait" : "Paint a portrait"} (uses their role and looks)">🎨</button> ` : ""}<button class="edit" data-edit="${i}">Edit</button></span></div>
      ${p.role ? `<div class="pline">${esc(p.role)}</div>` : ""}
      ${p.aliases?.length ? `<div class="pline muted">also: ${esc(p.aliases.join(", "))}</div>` : ""}

      ${p.where ? `<div class="pline"><span class="muted">Where:</span> ${esc(p.where)}</div>` : ""}
      ${p.standing ? `<div class="pline"><span class="muted">Attitude:</span> ${esc(p.standing)}</div>` : ""}
      ${p.notes?.length ? `<ul>${p.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
      ${seen ? `<div class="pline muted small">last seen in scene ${seen}</div>` : ""}
    </div>`;
  }).join("") || `<p class="muted">${q ? "Nobody matches." : "Nobody yet: people are added as you meet them."}</p>`;
  $("peopleList").querySelectorAll("[data-edit]").forEach(b => b.onclick = () => editPerson(+b.dataset.edit));
  $("peopleList").querySelectorAll("[data-zoom]").forEach(img => img.onclick = () => showPortrait(img.dataset.zoom, true));
  $("peopleList").querySelectorAll("[data-paint]").forEach(b => b.onclick = async () => {

function editPerson(i) {
  const p = PEOPLE[i];
  const card = $("peopleList").querySelector(`.pcard[data-i="${i}"]`);
  card.classList.add("editing-person");
  card.innerHTML = `
    <label>Name</label><input data-pf="name" value="${esc(p.name)}">
    <label>Also known as <span class="muted">(comma-separated)</span></label><input data-pf="aliases" value="${esc((p.aliases || []).join(", "))}">
    ${PERSON_FIELDS.map(([k, label]) => `<label>${label}</label><input data-pf="${k}" value="${esc(p[k] || "")}">`).join("")}
    <label>Notes <span class="muted">(one per line)</span></label><textarea data-pf="notes" rows="${Math.max(2, (p.notes || []).length + 1)}">${esc((p.notes || []).join("\n"))}</textarea>
    <div class="row-actions"><button class="primary" data-a="save">Save</button><button data-a="cancel">Cancel</button>
      ${p._new ? "" : `<button data-a="del" title="Remove this person (e.g. a duplicate or a mistake)">Remove</button>`}<span class="muted small" data-a="msg"></span></div>`;
  card.querySelector("[data-pf=name]").focus();
  card.querySelector("[data-a=cancel]").onclick = () => renderPeople();
  card.querySelector("[data-a=del]")?.addEventListener("click", () => {
    if (!confirm(`Remove ${p.name} from People?`)) return;
    savePeople(PEOPLE.filter((_, j) => j !== i), card);
  });
  card.querySelector("[data-a=save]").onclick = () => {
    const v = (k) => card.querySelector(`[data-pf=${k}]`).value.trim();
    if (!v("name")) return card.querySelector("[data-pf=name]").focus();

      notes: v("notes").split("\n").map(x => x.trim()).filter(Boolean) };
    for (const [k] of PERSON_FIELDS) upd[k] = v(k);
    if (upd._new) { const last = S.data.messages[S.data.messages.length - 1]; upd.first = upd.last = last ? last.id : 0; }
    delete upd._new;
    savePeople(PEOPLE.map((x, j) => j === i ? upd : x), card);
  };
}
async function savePeople(list, card) {
  try {
    await api(`/api/campaigns/${S.slug}/people`, { method: "PUT", body: JSON.stringify({ people: list.filter(p => !p._new) }) });
    await refreshSigs(); renderPeople();
  } catch (e) { card.querySelector("[data-a=msg]").textContent = e.message; }
}
