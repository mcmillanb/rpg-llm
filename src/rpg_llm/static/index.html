    <p><button id="saveSheet">Save</button> <span id="sheetMsg" class="muted"></span></p>
    ${d.situation ? `<h3>Where things stand</h3><div class="drawer-md">${md(d.situation)}</div>` : ""}
    ${d.threads ? `<h3>Open threads</h3><div class="drawer-md">${md(d.threads)}</div>` : ""}
    ${d.situation || d.threads ? `<p class="muted small">As of scene ${d.as_of}, the last one filed${d.unfiled > 2 ? `; the ${d.unfiled} scenes since are filed after a break in play` : ""}.</p>` : ""}
    ${d.earlier ? `<details ${d.unfiled > 2 ? "open" : ""}><summary><strong>Earlier this session</strong> <span class="muted">(condensed)</span></summary><div class="drawer-md">${md(d.earlier)}</div></details>` : ""}
    <h3>The story so far</h3>
    ${d.waiting ? `<p class="muted small">${d.waiting} finished scene${d.waiting > 1 ? "s are" : " is"} waiting to be filed (it happens in quiet moments). <a id="fileNow">File now</a> <span id="fileMsg"></span></p>` : ""}
    ${story.length ? story.map(s => `<div class="pcard">
      <div class="ptop"><span class="pname">Scene ${s.scene}${s.title ? ": " + esc(s.title) : ""}</span>${s.live ? `<span class="muted small">in play</span>` : ""}</div>
      ${s.location ? `<div class="pline muted">${esc(s.location)}</div>` : ""}
      ${s.summary ? `<div class="pline">${esc(s.summary)}</div>` : ""}</div>`).join("") : `<p class="muted">Nothing yet.</p>`}`;
  $("saveSheet").onclick = () => saveSheetFields(ch.sheet || {}, renderJournal);
  $("fileNow")?.addEventListener("click", async () => {
    $("fileNow").remove(); $("fileMsg").textContent = "Filing… (about a minute a scene)";
    startPoll();
    try { await api(`/api/campaigns/${S.slug}/compact`, { method: "POST" }); }
    catch (e) { $("fileMsg").textContent = e.message; return; }
    S.data = await api(`/api/campaigns/${S.slug}`); renderChat(false); refreshSigs();
    if (PANEL === "journal") renderJournal();
  });
}

// ---- archive: how the GM's memory works (for the curious) --------------------------------------
async function renderArchive() {
  const st = await api(`/api/campaigns/${S.slug}/status`);
  const gz = await api(`/api/campaigns/${S.slug}/file?path=gazetteer.yaml`);
  if (PANEL !== "archive") return;
  const ctx = st.last_context;
  $("drawerBody").innerHTML = `
    <h3>Campaign brief</h3><a data-path="brief.md">brief.md</a> · <a data-path="timeline.md">timeline.md</a> · <a data-path="gazetteer.yaml">gazetteer.yaml</a> · <a data-path="cast.yaml">cast.yaml</a>
    <h3>Scenes</h3><ol>${st.scenes.map(s => `<li>${s.note ? `<a data-path="${esc(s.note)}">${esc(s.title || "untitled")}</a>` : esc(s.title || "(in progress)")}
      <span class="muted">${esc(s.location || "")} · ${s.status}${s.confidence ? ` · ${Math.round(s.confidence * 100)}%` : ""}</span></li>`).join("")}</ol>
    <p><button id="compactNow">File closed scenes now</button> <span class="muted">normally automatic after ${esc("idle")}</span></p>
    <h3>Last turn: from the archive</h3>
    ${ctx ? `<div class="muted">${ctx.seconds}s · names matched: ${esc((ctx.alias_hits || []).join(", ") || "none")}<br>router: ${esc(typeof ctx.router === "object" && ctx.router ? ctx.router.reason : ctx.router || "off")}</div>
      ${ctx.notes ? `<pre class="file">${esc(ctx.notes)}</pre>` : "<p class='muted'>nothing added</p>"}` : "<p class='muted'>no turn yet</p>"}
    <h3>Last scene check</h3>
    ${st.last_verdict ? `<div class="muted">${st.last_verdict.transition ? "new scene" : "same scene"} · ${Math.round(st.last_verdict.confidence * 100)}% · ${esc(st.last_verdict.reason)}</div>` : "<p class='muted'>none yet</p>"}
    ${st.last_compaction ? `<h3>Last filing</h3><pre class="file">${esc(JSON.stringify(st.last_compaction, null, 2))}</pre>` : ""}
    <h3>Wiki (${st.gazetteer_size} entries)</h3><div id="gz"></div>
    <div id="fileView"></div>`;
  const entries = (gz.text.match(/path: .+/g) || []).map(l => l.slice(6).trim());
  $("gz").innerHTML = entries.map(p => `<a data-path="${esc(p)}">${esc(p)}</a>`).join("<br>") || "<span class='muted'>empty until the first scene is filed</span>";
  $("drawerBody").querySelectorAll("a[data-path]").forEach(a => a.onclick = async () => {
    const f = await api(`/api/campaigns/${S.slug}/file?path=${encodeURIComponent(a.dataset.path)}`);
    $("fileView").innerHTML = `<h3>${esc(f.path)}</h3><pre class="file">${esc(f.text)}</pre>`;
    $("fileView").scrollIntoView({ behavior: "smooth" });
  });
  $("compactNow").onclick = async () => {
    $("compactNow").disabled = true; $("compactNow").textContent = "Filing… (can take a few minutes)";
    try { await api(`/api/campaigns/${S.slug}/compact`, { method: "POST" }); }
    catch (e) { alert(e.message); }
    S.data = await api(`/api/campaigns/${S.slug}`); renderChat(false); renderArchive();
  };
}

// ---- wiring --------------------------------------------------------------
function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = t.scrollHeight + 2 + "px"; }
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer: coarse)").matches) { e.preventDefault(); send(); }
  else if (e.key === "ArrowUp" && !$("input").value && !S.busy && S.slug) { e.preventDefault(); startEditing(); }
});
function toggleArt(on = !document.body.dataset.viewart) {
  if (on) document.body.dataset.viewart = "1"; else delete document.body.dataset.viewart;
  $("artBtn").title = on ? "Bring the messages back (Esc)" : "View the artwork (click again, or Esc, to bring the messages back)";
}
$("artBtn").onclick = () => toggleArt();
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("lightbox").classList.contains("hidden")) { e.preventDefault(); closePortrait(); return; }
  if (e.key === "Escape" && document.body.dataset.viewart) { e.preventDefault(); toggleArt(false); return; }
  if (e.key !== "Escape" || !S.slug) return;
  if (!$("tray").classList.contains("hidden")) { e.preventDefault(); closeTray(); return; }
  if (S.busy) { e.preventDefault(); cancelTurn(); }
  else if (S.editing) { e.preventDefault(); $("input").value = ""; autosize(); stopEditing(); }
  else if (PANEL && $("modal").classList.contains("hidden") && !($("drawer").contains(document.activeElement) && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) { e.preventDefault(); closePanel(); }
});
$("send").onclick = send;
$("back").onclick = showList;
$("newBtn").onclick = openNewCampaign;
document.querySelectorAll("#rail [data-panel]").forEach(b => b.onclick = () => openPanel(b.dataset.panel));
$("closeDrawer").onclick = closePanel;
$("pinBtn").onclick = () => setPinned(!document.body.dataset.pinned);
try { setPinned(localStorage.getItem("pinned") === "1"); } catch {}
placeRail();
(async () => {
  try {
    const st = await api("/api/status");
    if (!st.configured) { location.href = "/admin"; return; }  // first run: set up models first
    S.imagesEnabled = !!st.images;
  } catch {}
  const q = new URLSearchParams(location.search).get("c");
  q ? openCampaign(q).catch(showList) : showList();
})();
</script>
</body>
</html>
