[project]
name = "rpg-llm"
version = "0.1.0"
description = "Self-hosted AI game master chat with a router-maintained campaign wiki"
authors = [
    { name = "Billy McMillan", email = "billy@mcmillanworld.co.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.13.1",
    "openai>=3.19.2",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
