name: Autoplay Traveller
system: Traveller (Mongoose 2e), Third Imperium, Spinward Marches
premise: You are Jonas Hale, a disgraced former Imperial Navy sensor officer, now
  a freelance salvage diver with a battered Type-S scout ship, the Kestrel. Your only
  crew is an ageing maintenance robot called Tock. You carry a data-crystal from your
  last salvage job that someone badly wants back. The story opens at the downport
  of Mora, a high-population world, where you have docked to sell salvage.
dm_instructions: Keep replies under 200 words. Introduce named NPCs.
